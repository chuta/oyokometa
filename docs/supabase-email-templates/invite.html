<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>You have been invited</title>
</head>
<body style="margin:0;padding:0;background:#000000;color:#f5f5f4;font-family:IBM Plex Sans,'Helvetica Neue',Helvetica,Arial,sans-serif">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0">Accept this invitation to create an Oyokometa account.</div>
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#000000">
    <tr><td style="padding:32px 16px">
      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;margin:0 auto">
        <tr>
          <td style="padding:0 0 20px">
            <img src="https://oyokometa.xyz/oyokometa_logo.png" alt="Oyokometa" width="180" style="display:block;height:auto;border:0">
          </td>
        </tr>
        <tr>
          <td style="background:#101010;border:1px solid #2a2a2a">
            <div style="height:3px;background:#f5a524;line-height:3px;font-size:0">&nbsp;</div>
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
              <tr>
                <td style="padding:28px 28px 32px">
                  <p style="margin:0 0 10px;color:#f5a524;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500">Account</p>
                  <h1 style="margin:0 0 18px;color:#f5f5f4;font-family:Outfit,'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:28px;line-height:1.15;letter-spacing:-0.03em;font-weight:600">You have been invited</h1>
                  <p style="margin:0 0 16px;line-height:1.55;color:#f5f5f4;font-size:16px">You were invited to create an Oyokometa account for {{ .Email }}. Accept to continue.</p>
                  <p style="margin:8px 0 12px">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#f5a524;color:#111111;text-decoration:none;font-weight:600;padding:12px 18px">Accept invitation</a>
                  </p>
                  <p style="margin:0;font-size:12px;line-height:1.5;color:#a8a29e;word-break:break-all;font-family:IBM Plex Mono,ui-monospace,Menlo,Consolas,monospace">{{ .ConfirmationURL }}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:22px 4px 0;color:#a8a29e;font-size:12px;line-height:1.55">
            <p style="margin:0">If you were not expecting this, you can ignore the message.</p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
