# Canonical deploy config is /fly.toml at the repo root.
# Keep this file as a pointer for infra docs.
app = "oyokometa-api"
primary_region = "lhr"

[build]
  dockerfile = "apps/api/Dockerfile"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
