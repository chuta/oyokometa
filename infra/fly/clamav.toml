# Private ClamAV daemon for upload scanning. No public ports; the API reaches it over Fly 6PN.
# One-time setup:
#   fly apps create oyokometa-clamav --org <org>
#   fly volumes create clamav_db --app oyokometa-clamav --region lhr --size 1
#   fly deploy --config infra/fly/clamav.toml --ha=false   (from repo root)
# Then on the API: fly secrets set CLAMAV_HOST=oyokometa-clamav.internal --app oyokometa-api
app = "oyokometa-clamav"
primary_region = "lhr"

[build]
  dockerfile = "../clamav/Dockerfile"

# shared-cpu-1x cannot exceed 2048 MB. A concurrent database reload doubles that and the
# kernel OOM-killed clamd. Reload is disabled in the image so one database fits in this size.
[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

[mounts]
  source = "clamav_db"
  destination = "/var/lib/clamav"

[checks]
  [checks.clamd]
    type = "tcp"
    port = 3310
    grace_period = "180s"
    interval = "30s"
    timeout = "5s"
