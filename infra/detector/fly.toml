# Private AI-image detector. No public ports; the API reaches it over Fly 6PN.
# From the repo root:
#   fly apps create oyokometa-detector --org <org>
#   fly deploy --config infra/detector/fly.toml --ha=false
# Then on the API:
#   fly secrets set DETECTOR_URL=http://oyokometa-detector.internal:8080 DETECTOR_AUTH_TOKEN=... --app oyokometa-api
app = "oyokometa-detector"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[[vm]]
  size = "shared-cpu-1x"
  memory = "2048mb"

[checks]
  [checks.ready]
    type = "http"
    port = 8080
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "120s"
